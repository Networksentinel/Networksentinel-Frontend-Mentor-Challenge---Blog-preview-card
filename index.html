<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

    <title>Frontend Mentor | Blog preview card</title>
  </head>
  <body>

    <main>
      <section class="card">

        <div class="card-img"></div>       
        <article>
          <h3 class="first-heading">Learning</h3>
          <h3 class="published">Published <time datetime="2023-12-21">21 Dec 2023</time></h3> 
          <h2 class="main-heading">HTML & CSS foundations</h2>  
          <p>
            These languages are the backbone of every website, defining structure, 
            content, and presentation.
          </p> 
        </article>

        <aside class="author">
          <img src="./src/images/image-avatar.webp" alt="Small avater image of the author">
          <h3>Greg Hooper</h3>
        </aside>

      </section>
    </main>

    <footer class="attribution">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
      Coded by <a href="#">Your Name Here</a>.
    </footer>

    <script type="module" src="./src/main.js"></script>

  </body>
</html>
